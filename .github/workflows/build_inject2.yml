name: Build AgentInject2 dylib

on:
  workflow_dispatch:

# 必须显式声明：GITHUB_TOKEN 默认是只读，否则 gh release create 会失败
# （老坑：产物编译 OK 但发布失败，而 artifact 在沙箱里从 Azure blob 下载不到）
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        id: b
        run: |
          set -o pipefail
          chmod +x build_inject2.sh
          bash build_inject2.sh 2>&1 | tee /tmp/dylib_build.txt
          echo "BUILD_OK_MARK=$(grep -c BUILD_OK /tmp/dylib_build.txt)" >> $GITHUB_OUTPUT

      - name: Ad-hoc sign (OTA 需要)
        if: success()
        run: |
          # 手机 OTA 下载的 dylib 要过 dlopen：未签名的会被 AMFI 拒
          # ("code signature invalid")。ad-hoc 签名让签名槽有效。
          codesign --force --sign - build/AgentInject2.dylib 2>&1 | tail -3 || \
            ldid -S build/AgentInject2.dylib 2>&1 | tail -3 || true
          codesign -dv build/AgentInject2.dylib 2>&1 | head -3 || true
          ls -la build/AgentInject2.dylib

      - name: Upload dylib
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AgentInject2.dylib
          path: build/AgentInject2.dylib

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="inject2-${{ github.run_number }}"
          gh release create "$TAG" \
            build/AgentInject2.dylib \
            build/AgentInject2.zip \
            --title "AgentInject2 dylib $TAG" \
            --notes "TrollFools 注入用：下载 AgentInject2.zip → 解压出 .dylib → TrollFools 选择 App 注入 → 打开 App 等 8 秒 → 看盖屏自检报告"

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 沙箱里下载不到 artifact / job logs（DNS 被拦），所以把日志 base64 塞进
          # release notes —— 这是目前唯一能稳定把编译错误读回去的通道。
          TAG="inject2log-${{ github.run_number }}"
          gh release delete "$TAG" -y 2>/dev/null || true
          # 只抓 error 行（+ 上下文 2 行），别再 tail 8000 —— 尾部全是 warning，
          # 真正的 error 被冲掉了，上一轮就是这么白跑一趟的。
          grep -nE "(error|fatal|ld:|clang:)" /tmp/dylib_build.txt | head -60 > /tmp/errs.txt
          sed -nE '/error:/{=;p}' /tmp/dylib_build.txt | head -80 > /tmp/errctx.txt
          B64=$( { echo "=== ERROR LINES ==="; cat /tmp/errs.txt;
                   echo "=== CONTEXT ==="; cat /tmp/errctx.txt;
                   echo "=== TAIL ==="; tail -c 1200 /tmp/dylib_build.txt; } | base64 | tr -d '\n')
          gh release create "$TAG" \
            --title "Build log $TAG" \
            --notes "编译失败日志（base64，仅 error 行+上下文）:
          $B64" || true
