name: Build AgentProbe IPA (v3)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build AgentProbe IPA
        run: |
          chmod +x ios-poc/build_probe2.sh
          set -o pipefail
          ./ios-poc/build_probe2.sh 2>&1 | tee build_probe2_output.txt
          exit ${PIPESTATUS[0]}

      - name: Dump entitlements of built app
        if: always()
        run: |
          echo "=== 签名后 entitlements ==="
          codesign -d --entitlements :- ios-poc/build/Payload/AgentProbe.app 2>&1 || true
          echo "=== IPA 内容 ==="
          unzip -l ios-poc/build/AgentProbe-D.ipa 2>&1 || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentProbe
          path: ios-poc/build/AgentProbe-D.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="probe3log-${{ github.run_number }}"
          gh release create "$TAG" build_probe2_output.txt \
            --title "Probe3 log $TAG" \
            --notes "AgentProbe 编译失败日志" || \
          gh release upload "$TAG" build_probe2_output.txt --clobber || true

      - name: Create Release with direct download link
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="probe3-${{ github.run_number }}"
          gh release create "$TAG" ios-poc/build/AgentProbe-D.ipa \
            --title "AgentProbe $TAG" \
            --notes "模拟点击 + 截图 + 权限自证 能力探针。TrollStore 安装。" || \
          gh release upload "$TAG" ios-poc/build/AgentProbe-D.ipa --clobber

      - name: Print direct links
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="probe3-${{ github.run_number }}"
          REPO="${GITHUB_REPOSITORY}"
          echo "=================== 直链 ==================="
          echo "https://github.com/${REPO}/releases/download/${TAG}/AgentProbe-D.ipa"
          echo "============================================"
