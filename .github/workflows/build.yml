name: Build PoCAgent IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build IPA
        run: |
          chmod +x build.sh
          set -o pipefail
          ./build.sh 2>&1 | tee build_output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="logs-${{ github.run_number }}"
          gh release create "$TAG" build_output.txt \
            --title "Build log $TAG" \
            --notes "编译失败时的完整日志，供远程分析" || \
          gh release upload "$TAG" build_output.txt --clobber || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoCAgent.ipa
          path: build/PoCAgent.ipa
          if-no-files-found: error

      # 生成公开直链：手机 Safari 打开后可直接分享到 TrollStore 安装
      - name: Create Release with direct download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" build/PoCAgent.ipa \
            --title "PoCAgent $TAG" \
            --notes "自动构建产物。手机 Safari 打开下方 IPA 直链，选择分享到 TrollStore 即可安装。" || \
          gh release upload "$TAG" build/PoCAgent.ipa --clobber

      - name: Print direct link
        run: |
          echo "===== IPA 下载直链 ====="
          echo "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/PoCAgent.ipa"
          echo ""
          echo "（也可以在本页底部 Artifacts 区域下载）"
